info:
  title: Snapcart API
  description: API documentation for the Snapcart Quick e-Commerce platform
  version: '1.0'
  contact:
    name: Rahil K
    url: https://www.linkedin.com/in/rahil234/
    email: rahilsardar234@gmail.com
tags: []
servers:
  - url: http://localhost:4000
    description: Local Server
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
    cookie:
      type: apiKey
      in: cookie
      name: connect.sid
  schemas:
    MessageOnlyResponse:
      type: object
      properties:
        message:
          type: string
          example: Response sent successfully
      required:
        - message
    RegisterDto:
      type: object
      properties:
        email:
          type: string
          description: Email address
          example: user@example.com
        phone:
          type: string
          description: Phone number
          example: '+1234567890'
        password:
          type: string
          description: Password (min 6 characters)
          example: password123
      required:
        - password
    BadRequestErrorDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 400
        message:
          example:
            - name should not be empty
            - email must be an email
          description: List of validation errors
          type: array
          items:
            type: string
        error:
          type: string
          example: Bad Request
      required:
        - statusCode
        - message
        - error
    ConflictErrorDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 409
        message:
          type: string
          example: Resource already exists
        error:
          type: string
          example: Conflict
      required:
        - statusCode
        - message
        - error
    InternalServerErrorDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 500
        message:
          type: string
          example: Internal server error
        error:
          type: string
          example: Internal Server Error
      required:
        - statusCode
        - message
        - error
    LoginDto:
      type: object
      properties:
        identifier:
          type: string
          description: Email or phone number
          example: user@example.com
        method:
          type: string
          description: Authentication method (PASSWORD or OTP only)
          enum:
            - PASSWORD
            - OTP
          example: PASSWORD
        password:
          type: string
          description: Password (required for PASSWORD method)
          example: password123
        otp:
          type: string
          description: OTP code (required for OTP method)
          example: '1234'
      required:
        - identifier
        - method
    LoginWithGoogleDto:
      type: object
      properties:
        idToken:
          type: string
          description: Google ID token
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6...
      required:
        - idToken
    RequestOTPDto:
      type: object
      properties:
        identifier:
          type: string
          description: Email or phone number
          example: user@example.com
      required:
        - identifier
    VerifyOTPDto:
      type: object
      properties:
        identifier:
          type: string
          description: Email or phone number
          example: user@example.com
        otp:
          type: string
          description: OTP code (4 digits)
          example: '1234'
      required:
        - identifier
        - otp
    ForgotPasswordDto:
      type: object
      properties:
        identifier:
          type: string
          description: Email or phone number
          example: user@example.com
      required:
        - identifier
    ResetPasswordDto:
      type: object
      properties:
        identifier:
          type: string
          description: Email or phone number
          example: user@example.com
        otp:
          type: string
          description: OTP code (4 digits)
          example: '1234'
        newPassword:
          type: string
          description: New password (min 6 characters)
          example: newpassword123
      required:
        - identifier
        - otp
        - newPassword
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
          description: Current password
          example: oldpassword123
        newPassword:
          type: string
          description: New password (min 6 characters)
          example: newpassword123
      required:
        - currentPassword
        - newPassword
    HttpResponse:
      type: object
      properties:
        message:
          type: string
          example: Response sent successfully
        data:
          type: object
      required:
        - message
    CustomerProfileDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        profilePicture:
          type: string
      required:
        - id
    SellerProfileDto:
      type: object
      properties:
        id:
          type: string
        storeName:
          type: string
        isVerified:
          type: boolean
      required:
        - id
        - storeName
        - isVerified
    MeResponseDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - ADMIN
            - SELLER
            - CUSTOMER
        status:
          type: string
          enum:
            - active
            - suspended
            - disabled
        customerProfile:
          $ref: '#/components/schemas/CustomerProfileDto'
        sellerProfile:
          $ref: '#/components/schemas/SellerProfileDto'
      required:
        - id
        - role
        - status
    UnauthorizedErrorDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 401
        message:
          type: string
          example: Unauthorized
        error:
          type: string
          example: Unauthorized
      required:
        - statusCode
        - message
        - error
    ForbiddenErrorDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 403
        message:
          type: string
          example: Forbidden resource
        error:
          type: string
          example: Forbidden
      required:
        - statusCode
        - message
        - error
    PaginationMetaDto:
      type: object
      properties:
        page:
          type: number
          description: Current page number
          example: 1
        limit:
          type: number
          description: Number of items per page
          example: 10
        total:
          type: number
          description: Total number of items
          example: 100
        hasNextPage:
          type: boolean
          description: Whether there is a next page
          example: true
        hasPrevPage:
          type: boolean
          description: Whether there is a previous page
          example: false
      required:
        - page
        - limit
        - total
        - hasNextPage
        - hasPrevPage
    HttpPaginatedResponse:
      type: object
      properties:
        message:
          type: string
          example: Response sent successfully
        data:
          type: object
        meta:
          description: Pagination metadata
          allOf:
            - $ref: '#/components/schemas/PaginationMetaDto'
      required:
        - message
        - meta
    UserResponseDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          description: >-
            Email address of the user. Optional if the user registered with
            phone number.
          example: user@example.com
          nullable: true
        phone:
          type: string
          description: >-
            Phone number of the user. Optional if the user registered with email
            address.
          example: '+1234567890'
          nullable: true
        role:
          type: string
          enum:
            - ADMIN
            - SELLER
            - CUSTOMER
        status:
          type: string
          enum:
            - active
            - suspended
            - disabled
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - phone
        - role
        - status
        - createdAt
        - updatedAt
    NotFoundErrorDto:
      type: object
      properties:
        statusCode:
          type: number
          example: 404
        message:
          type: string
          example: Resource not found
        error:
          type: string
          example: Not Found
      required:
        - statusCode
        - message
        - error
    UpdateUserDto:
      type: object
      properties:
        name:
          type: string
          description: User name
        email:
          type: string
          description: User email
        phone:
          type: string
          description: User phone
        dob:
          format: date-time
          type: string
          description: Date of birth
        gender:
          type: string
          description: Gender
          enum:
            - male
            - female
            - other
    UpdateUserStatusDto:
      type: object
      properties:
        status:
          type: string
          description: Account status
          enum:
            - active
            - suspended
            - disabled
      required:
        - status
    ProfilePictureUploadResponseDto:
      type: object
      properties:
        provider:
          type: string
          description: Storage provider (cloudinary or azure)
          example: cloudinary
        uploadUrl:
          type: string
          description: Upload URL
          example: https://api.cloudinary.com/v1_1/demo/image/upload
        method:
          type: string
          description: HTTP method to use for upload
          example: POST
        fields:
          type: object
          description: Additional fields required for upload (for Cloudinary)
          example:
            timestamp: '1234567890'
            signature: abc123...
            api_key: your_api_key
            folder: profile-pictures
        readUrl:
          type: string
          description: Read URL for the uploaded file (for Azure)
      required:
        - provider
        - uploadUrl
        - method
    GenerateProfilePictureUploadUrlDto:
      type: object
      properties:
        fileName:
          type: string
          description: File name for the profile picture
          example: profile_user123_1234567890.jpg
      required:
        - fileName
    SaveProfilePictureDto:
      type: object
      properties:
        url:
          type: string
          description: URL of the uploaded profile picture
          example: >-
            https://res.cloudinary.com/demo/image/upload/v1234567890/profile_picture.jpg
      required:
        - url
    AddressResponseDto:
      type: object
      properties:
        id:
          type: string
        customerId:
          type: string
        isPrimary:
          type: boolean
        houseNo:
          type: string
        street:
          type: string
        city:
          type: string
        state:
          type: string
        country:
          type: string
        pincode:
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - customerId
        - isPrimary
        - createdAt
        - updatedAt
    CreateAddressDto:
      type: object
      properties:
        houseNo:
          type: string
          description: House number
        street:
          type: string
          description: Street
        city:
          type: string
          description: City
        state:
          type: string
          description: State
        country:
          type: string
          description: Country
        pincode:
          type: string
          description: Pincode
        isPrimary:
          type: boolean
          description: Is primary address
          default: false
    UpdateAddressDto:
      type: object
      properties:
        houseNo:
          type: string
          description: House number (set to null to clear)
        street:
          type: string
          description: Street (set to null to clear)
        city:
          type: string
          description: City (set to null to clear)
        state:
          type: string
          description: State (set to null to clear)
        country:
          type: string
          description: Country (set to null to clear)
        pincode:
          type: string
          description: Pincode (set to null to clear)
        isPrimary:
          type: boolean
          description: Is primary address
    Object:
      type: object
      properties: {}
    ProductResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Product ID
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          description: Product name
          example: Basmati Rice
        description:
          type: string
          description: Product description
          example: Premium long-grain basmati rice from Punjab
        categoryId:
          type: string
          description: Category ID
          example: 123e4567-e89b-12d3-a456-426614174001
        brand:
          type: string
          description: Brand name
          example: India Gate
        status:
          type: string
          description: Product status (catalog lifecycle)
          enum:
            - active
            - inactive
            - discontinued
          example: active
        isActive:
          type: boolean
          description: Whether product is active in catalog
          example: true
        isInCatalog:
          type: boolean
          description: Whether product is in catalog (not deleted/discontinued)
          example: true
        createdAt:
          format: date-time
          type: string
          description: Product creation date
          example: '2026-02-01T10:00:00.000Z'
        updatedAt:
          format: date-time
          type: string
          description: Product last update date
          example: '2026-02-01T15:30:00.000Z'
      required:
        - id
        - name
        - description
        - categoryId
        - status
        - isActive
        - isInCatalog
        - createdAt
        - updatedAt
    UpdateProductDto:
      type: object
      properties:
        name:
          type: string
          description: Product name
          example: Premium Basmati Rice
          minLength: 1
          maxLength: 200
        description:
          type: string
          description: Product description
          example: Extra long grain premium basmati rice
          maxLength: 2000
        brand:
          type: string
          description: Brand name
          example: India Gate Premium
          maxLength: 100
        categoryId:
          type: string
          description: Category ID (use with caution - cannot change if discontinued)
          example: 123e4567-e89b-12d3-a456-426614174001
        status:
          type: string
          description: Product status (catalog lifecycle)
          enum:
            - active
            - inactive
            - discontinued
          example: active
    CategoryNestedDto:
      type: object
      properties:
        id:
          type: string
          description: Category ID
          example: 123e4567-e89b-12d3-a456-426614174001
        name:
          type: string
          description: Category name
          example: Groceries
        status:
          type: string
          description: Category status
          example: active
          enum:
            - active
            - inactive
      required:
        - id
        - name
        - status
    VariantPreviewDto:
      type: object
      properties:
        id:
          type: string
          description: Variant ID
          example: c000000000000000000000000
        variantName:
          type: string
          description: Variant name
          example: 1kg
        price:
          type: number
          description: Base price
          example: 120
        discountPercent:
          type: number
          description: Discount percentage
          example: 10
        finalPrice:
          type: number
          description: Final price after discount
          example: 108
        stock:
          type: number
          description: Stock quantity
          example: 100
        imageUrl:
          type: string
          description: Single image URL (first image)
          example: https://res.cloudinary.com/demo/image1.jpg
        availableForPurchase:
          type: boolean
          description: Whether variant is available for purchase
          example: true
      required:
        - id
        - variantName
        - price
        - discountPercent
        - finalPrice
        - stock
        - imageUrl
        - availableForPurchase
    ProductWithVariantPreviewDto:
      type: object
      properties:
        id:
          type: string
          description: Product ID
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          description: Product name
          example: Basmati Rice
        brand:
          type: string
          description: Brand name
          example: India Gate
        category:
          description: Category details
          allOf:
            - $ref: '#/components/schemas/CategoryNestedDto'
        variant:
          description: Featured/first variant for quick preview
          allOf:
            - $ref: '#/components/schemas/VariantPreviewDto'
      required:
        - id
        - name
        - category
        - variant
    VariantResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Variant ID
          example: c000000000000000000000000
          format: cuid
        productId:
          type: string
          description: Product ID
          example: c000000000000000000000001
          format: cuid
        variantName:
          type: string
          description: Variant name
          example: 1kg
        price:
          type: number
          description: Base price
          example: 120
        discountPercent:
          type: number
          description: Discount percentage
          example: 10
        finalPrice:
          type: number
          description: Final price after discount
          example: 108
        stock:
          type: number
          description: Stock quantity
          example: 100
        status:
          type: string
          description: Variant status
          enum:
            - active
            - inactive
            - out_of_stock
          example: active
        isActive:
          type: boolean
          description: Whether variant is active
          example: true
        inStock:
          type: boolean
          description: Whether variant is in stock
          example: true
        availableForPurchase:
          type: boolean
          description: Whether variant is available for purchase
          example: true
        sellerProfileId:
          type: object
          description: Seller profile ID
          example: 123e4567-e89b-12d3-a456-426614174002
          nullable: true
        attributes:
          type: object
          description: Additional attributes
          example:
            weight: 1kg
            organic: true
          nullable: true
        images:
          description: Image URLs (array of strings, max 6)
          example:
            - https://res.cloudinary.com/demo/image1.jpg
            - https://res.cloudinary.com/demo/image2.jpg
          type: array
          items:
            type: string
        createdAt:
          format: date-time
          type: string
          description: Creation date
          example: '2026-02-01T10:00:00.000Z'
        updatedAt:
          format: date-time
          type: string
          description: Last update date
          example: '2026-02-01T15:30:00.000Z'
      required:
        - id
        - productId
        - variantName
        - price
        - discountPercent
        - finalPrice
        - stock
        - status
        - isActive
        - inStock
        - availableForPurchase
        - images
        - createdAt
        - updatedAt
    ProductWithVariantsResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Product ID
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          description: Product name
          example: Basmati Rice
        description:
