  /api/users:
    get:
      description: Retrieves all users with pagination. Admin only.
      operationId: UserController_findAll
      parameters:
        - name: page
          required: false
          in: query
          description: Page number
          schema:
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Items per page
          schema:
            default: 10
            type: number
        - name: search
          required: false
          in: query
          description: Search term
          schema:
            type: string
        - name: status
          required: false
          in: query
          description: Filter by status
          schema:
            type: string
            enum:
              - active
              - suspended
              - disabled
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/HttpPaginatedResponse'
