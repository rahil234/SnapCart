openapi: 3.0.0
paths:
  /api/auth/register:
    post:
      description: Creates a new customer account with email/phone and password
      operationId: AuthController_register
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MessageOnlyResponse'
                  - {}
        '400':
          description: Invalid input data or validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestErrorDto'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictErrorDto'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerErrorDto'
      summary: Register a new user
      tags:
        - Authentication
  /api/auth/login:
